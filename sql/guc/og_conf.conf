# === dbbench overrides ===
# Mirrors sql/guc/pg_guc.sql value for value.
#
# Why this file exists as well as sql/guc/og_guc.sql: openGauss 5.0 rejects
# most of these through ALTER SYSTEM --
#
#   ALTER SYSTEM SET only support POSTMASTER-level, SIGHUP-level and
#   BACKEND-level guc variable, and it must be allowed to set in postgresql.conf
#
# -- so postgresql.auto.conf stays empty and the settings have to go into the
# server's own configuration file. scripts/20_align_guc.sh appends this block
# idempotently and removes the previous one first. That openGauss cannot be
# configured the same way as PostgreSQL is itself a reportable finding.

shared_buffers            = 4GB
work_mem                  = 64MB
maintenance_work_mem      = 1GB
max_connections           = 200

# durability -- identical semantics to the PostgreSQL side
# (openGauss spells PG's wal_level='replica' as 'hot_standby')
wal_level                 = hot_standby
synchronous_commit        = on
fsync                     = on
full_page_writes          = on
checkpoint_timeout        = 15min

# NOTE: max_wal_size does NOT exist in openGauss 5.0 -- setting it aborts
# startup with "unrecognized configuration parameter". PostgreSQL 17 has it,
# openGauss 5.0 does not (its WAL sizing knobs are different and named
# differently). This is recorded in the report's configuration table as an
# engine-specific difference rather than silently dropped.

# costing / determinism
# effective_cache_size matters as much as shared_buffers for planner choices,
# and openGauss ships 128MB against PostgreSQL's 4GB. Left unaligned, the two
# engines would be answering different planning questions.
effective_cache_size      = 10GB
random_page_cost          = 1.1
track_io_timing           = on
autovacuum                = off

# openGauss-only: the thread-pool model is the single biggest architectural
# difference for the high-concurrency experiment. The harness sweeps it
# explicitly (enable_thread_pool=on/off) rather than inheriting a default.
enable_thread_pool        = off

# openGauss-only: the in-place-update storage engine is DISABLED by default in
# the 7.0 line; without this, CREATE TABLE ... WITH (storage_type=USTORE) fails
# with "Ustore is disabled, please set enable_ustore=on". It is a postmaster-level
# parameter, so it needs the restart that 20_align_guc.sh already performs.
enable_ustore             = @ENABLE_USTORE@

# openGauss-only: md5 hashing so the stock PostgreSQL JDBC driver can connect as
# a fallback if the opengauss-jdbc artifact is unavailable. See benchmark/lib/README.md
password_encryption_type  = 0

# === end dbbench overrides ===
